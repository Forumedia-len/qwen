message = "<p style=\"font-size:12px\">Cookies are small text files that are used by websites to make the operation of these sites more efficient. The necessary cookies help make a website usable by enabling basic functions such as page navigation and access to secure areas of the website. The website cannot function properly without these cookies. The law allows us to store these cookies on your device if they are strictly necessary for the operation of the site.</p><br/> <p style=\"font-size:12px\"><strong>For everyone We need your permission for other types of cookies:</strong></p><br/> <p style=\"font-size:12px\">This site uses different cookies. Also in order to be able to assign content and advertisements that are personalized to them and to analyze our website. We also provide this information specifically to be able to offer additional functions in these social media. Our partners may combine this information with other data that they may have previously provided.</p>"
