[cookie]
message = "<p style=\"font-size:12px\">Cookies sind kleine Textdateien, die von Internetseiten verwendet werden, um den Betrieb dieser Seiten effizienter zu gestalten. Die notwendigen Cookies helfen dabei, eine Webseite überhaupt erst nutzbar zu machen, indem sie Grundfunktionen wie Seitennavigation und Zugriff auf sichere Bereiche der Webseite ermöglichen. Die Webseite kann ohne diese Cookies nicht richtig funktionieren. Nach dem Gesetz dürfen wir diese Cookies auf Ihrem Gerät speichern, wenn diese für den Betrieb der Seite unbedingt notwendig sind.</p><br/> <p style=\"font-size:12px\"><strong>Für alle anderen Cookie-Typen benötigen wir Ihre Erlaubnis:</strong></p><br/> <p style=\"font-size:12px\">Diese Seite verwendet unterschiedliche Cookies. Auch um Inhalte und Anzeigen, auf sie personalisiert, zuordnen zu können und um unsere Website zu analysieren. Wir geben diese Informationen auch gezielt weitere Funktionen in diesen Sozialen Medien anbieten zu können. Unsere Partner führen diese Informationen möglicherweise mit weiteren Daten zusammen,die von ihnen ggf. schon früher bereitgestellt worden sind.</p>"
title = "Diese Webseite verwendet Cookies"
about_cookies = "Cookies sind kleine Textdateien, die von Webseiten verwendet werden, um die Benutzererfahrung effizienter zu gestalten.<br/> Laut Gesetz können wir Cookies auf Ihrem Gerät speichern, wenn diese für den Betrieb dieser Seite unbedingt notwendig sind. Für alle anderen Cookie-Typen benötigen wir Ihre Erlaubnis.<br/> Diese Seite verwendet unterschiedliche Cookie-Typen. Einige Cookies werden von Drittparteien platziert, die auf unseren Seiten erscheinen.<br/> Sie können Ihre Einwilligung jederzeit von der Cookie-Erklärung auf unserer Website ändern oder widerrufen.<br/> Erfahren Sie in unserer Datenschutzrichtlinie mehr darüber, wer wir sind, wie Sie uns kontaktieren können und wie wir personenbezogene Daten verarbeiten.<br/> Bitte geben Sie Ihre Einwilligungs-ID und das Datum an, wenn Sie uns bezüglich Ihrer Einwilligung kontaktieren."
