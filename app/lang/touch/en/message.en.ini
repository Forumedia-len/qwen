[messages_common]
info_text_registration_mask_top = "Yes, I would like to book courts "ONLINE"!"
info_text_registration_mask_bottom = "I hereby consent to the costs (only for the "Invoice" option) for the booked court usage being debited from my above-mentioned account via direct debit. I am responsible for ensuring sufficient funds are available in my account."
info_text_after_registration_cash_payer_aut_active = "<p>Thank you for registering. You can now book via PayPal with your account.</p>"
info_text_after_registration_cash_payer_man_active = "<p>Thank you for registering. You can now book via PayPal with your account.</p>"
info_text_after_registration_invoice_aut_active = "<p>Thank you for registering with our booking system.<br/>Your account is now active and you can now reserve your preferred times.</p>"
info_text_after_registration_invoice_man_active = "<p>Thank you for registering with our booking system.<br/>You can book with us after activation. Have fun playing!</p>"

