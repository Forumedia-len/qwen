[messages_default]
info_text_registration_mask_top = "<p>Ja, ich möchte "ONLINE" Plätze buchen!</p>"
info_text_registration_mask_bottom = "Hiermit willige ich ein, dass die Kosten (nur bei Option "Rechnung") für die gebuchte Platznutzung von meinem oben genannten Konto per Lastschrift-Einzugsverfahren abgebucht werden. Für eine ausreichende Kontodeckung bin ich verantwortlich."

info_text_after_registration_cash_payer_aut_active = "<p>Vielen Dank für Ihre Anmeldung. Sie können mit Ihrem Account nun über PayPal buchen.</p>"
info_text_after_registration_cash_payer_man_active = "<p>Vielen Dank für Ihre Anmeldung. Sie können mit Ihrem Account nun über PayPal buchen.</p>"
info_text_after_registration_invoice_aut_active = "<p>Vielen Dank für deine Anmeldung an unserem Buchungssystem.<br/>Dein Account ist nun aktiv und du kannst ab sofort deine Wunschzeiten reservieren.</p>"
info_text_after_registration_invoice_man_active = "<p>Vielen Dank für deine Anmeldung an unserem Buchungssystem.<br/>Sie können nach Freischaltung bei uns buchen. Viel Spaß beim spielen!</p>"

info_text_before_booking_invoice = "<p><span class="font30">Die Gebühr von  <strong><span class="sum_price">{{price}}</span></strong> +/- Optionen für diese Einzelstunde wird Ihnen demnächst belastet. <br/>Bitte bestätigen Sie jetzt Ihre Reservierung.</span></p>"
info_text_before_booking_cash_payer = "<p>Vielen Dank für Ihre Buchung. Sie sind bei uns als Barzahler registriert.<br/> Bitte werfen Sie deshalb den fälligen Betrag von <span class="sum_price">{{price}}</span> in den Geldbriefkasten. Legen Sie vor Ort das Geld in den bereitliegenden Geldumschlag, schreiben Sie Ihren Namen, Platz und Zeit darauf und werfen Sie dann den Geld-Umschlag in den Geldbriefkasten.</p>"
info_text_before_guest_booking_without_login = "<p>Den Betrag von <strong>{{price}}</strong> +/- den Optionen, den Sie evt. unterhalb wählen, werfen Sie bitte im Umschlag, mit Ihrem Namen, in den Geldbriefkasten!<br />Bitte bestätigen Sie jetzt Ihre Buchung.</p>"


info_text_above_timetable = "<p>Aus dem unten dargestellten Terminplan können Sie sich über den<br />Stand der Reservierungen am aktuell ausgewählten Datum informieren.</p>"
info_text_when_booking = ""
info_text_after_booking_cash_payer = "<p><strong><span style="font-size:16px">Vielen Dank</span><br />für Ihre Reservierung</strong></p><p><span style="font-size:16px">Bitte werfen Sie den fälligen Betrag in den Geldbriefkasten. Legen Sie vor Ort das Geld in den bereitliegenden Geldumschlag, schreiben Sie Ihren Namen, Platz und Zeit darauf und werfen Sie dann den Geld-Umschlag in den Geldbriefkasten.</span><br /><span style="font-size:16px">Der Preis beträgt {{price}}.</span></p>"
info_text_after_booking_billing_customer = "<p><strong><span style="font-size:16px">Vielen Dank</span><br />für Ihre Reservierung</strong></p>"
info_text_after_booking_credit = "<p><strong><span style="font-size:16px">Vielen Dank</span><br />für Ihre Reservierung</strong></p><p><span style="font-size:16px">Der Betrag von {{price}} wurde Ihrem Guthaben abgezogen.</span></p>"
info_text_after_booking_paypal = "<p><strong><span style="font-size:16px">Vielen Dank</span><br />für Ihre Reservierung!</strong></p><p><span style="font-size:16px">Sie sind bei uns als Barzahler registriert.<br />Der Preis beträgt {{price}}.<br />Eine kostenfreie Stornierung der Buchung ist bis zu {{cancellation_days}} Tag(e) vor dem Spieltermin möglich.</span></p>"
info_text_after_booking_guest = "<p><strong><span style="font-size:16px">Vielen Dank</span><br />für Ihre Reservierung</strong></p><p>Sie sind bei uns als Barzahler registriert. Bitte werfen Sie deshalb den fälligen Betrag von&nbsp;<strong>{{price}}</strong> in den Geldbriefkasten. Legen Sie vor Ort das Geld in den bereitliegenden Geldumschlag, schreiben Sie Ihren Namen, Platz und Zeit darauf und werfen Sie dann den Geld-Umschlag in den Geldbriefkasten.</p>"
info_text_door_code_text = "<p> Unsere Plätze verfügen über eine Zutrittskontrolle.</p><p>Den Code für Ihren Zugang finden Sie unterhalb.</p><p>Dieser ist von 30 Minuten vor Ihrer Spielzeit, bis 30 Minuten nach Ihrer Spielzeit gültig.</p>"

